name: Resolve 1.21.1 lock

# Re-resolves pakku-lock.json for 1.21.1 NeoForge from the 1.20.1 lock on main and the decisions
# in tools/port/mods-1.21.1.json, then commits the result to the branch that triggered it.
on:
  workflow_dispatch:
  push:
    paths: ['tools/port/**', '.github/workflows/port-lock.yml']

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve lock
        run: |
          git show origin/main:pakku-lock.json > "$RUNNER_TEMP/base-lock.json"
          python3 tools/port/port_lock.py --base "$RUNNER_TEMP/base-lock.json" --report docs/port/lock-report.md
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add pakku-lock.json pakku.json docs/port/lock-report.md
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Resolve pakku lock for 1.21.1 NeoForge"
          git push origin "HEAD:${GITHUB_REF_NAME}"
