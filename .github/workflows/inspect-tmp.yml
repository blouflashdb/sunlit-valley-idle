name: Inspect Society Tweaks (temporary)
on:
  push:
    paths: ['.github/workflows/inspect-tmp.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -o s.jar https://edge.forgecdn.net/files/8684/561/society-1.22.jar
          unzip -l s.jar > list.txt
          echo "== classes"; grep '\.class$' list.txt | awk '{print $4}'
          echo "== data dirs"; awk '{print $4}' list.txt | grep '^data/' | cut -d/ -f1-3 | sort | uniq -c
          echo "== textures item count"; grep -c 'assets/society/textures/item/' list.txt || true
          echo "== ocean_stone"; grep -i 'ocean_stone' list.txt || true
          mkdir x && cd x && unzip -q ../s.jar
          echo "== strings in registry classes"
          for c in $(find io -path '*registry*' -name '*.class'); do echo "--- $c"; strings "$c" | grep -E '^[a-z_]+$' | head -200 | tr '\n' ' '; echo; done
          echo "== lang ocean_stone"; grep -o '"item.society.ocean_stone[^,]*' assets/society/lang/en_us.json || true
          echo "== pack.mcmeta"; cat pack.mcmeta || true
