name: Inspect Society Tweaks (temporary)
on:
  push:
    paths: ['.github/workflows/inspect-tmp.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -o s.jar https://edge.forgecdn.net/files/8684/561/society-1.22.jar
          unzip -l s.jar > list.txt
          tail -1 list.txt
          echo "== top dirs"; awk '{print $4}' list.txt | cut -d/ -f1-3 | sort | uniq -c | sort -rn | head -40
          echo "== crystalarium"; grep -i crystalarium list.txt
          echo "== class count"; grep -c '\.class$' list.txt || true
          echo "== java packages"; grep '\.class$' list.txt | awk '{print $4}' | xargs -n1 dirname | sort -u | head -40
          echo "== meta"; unzip -p s.jar META-INF/mods.toml
          echo "== license files"; grep -i -E 'license|copying' list.txt
          for f in $(grep -i -E 'license|copying' list.txt | awk '{print $4}'); do echo "--- $f"; unzip -p s.jar "$f" | head -20; done
          echo "== mixins"; unzip -p s.jar $(grep -i 'mixins.json' list.txt | awk '{print $4}' | head -1) || true
          curl -sS https://api.cfwidget.com/1424785 | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('title'),d.get('license'),d.get('members'),d.get('urls'))" || true
