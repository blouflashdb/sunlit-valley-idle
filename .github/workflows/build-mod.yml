name: Build mod and pack

# Port branch (epic #5): builds the sunlitidle mod on 1.21.1 NeoForge, runs its unit and game tests,
# exports the pack with it and boots a NeoForge server with the whole pack plus the mod as a smoke test.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Download Gradle
        # The Gradle distribution host has outages; retry for a few minutes before giving up.
        working-directory: mod
        run: |
          chmod +x gradlew
          for attempt in 1 2 3 4 5 6; do
            ./gradlew --version --no-daemon && exit 0
            echo "Gradle download failed (attempt $attempt), retrying in 60 s"; sleep 60
          done
          exit 1
      - name: Build mod and run unit tests
        working-directory: mod
        run: |
          ./gradlew build --no-daemon
      - name: Run in-game tests
        working-directory: mod
        run: |
          ./gradlew runGameTestServer --no-daemon 2>&1 | tee gametest.log
          # Fail if the tests were not found or did not all pass.
          grep -E "All [0-9]+ required tests passed" gametest.log
      - name: Check loading screen tips (#18)
        run: python3 tools/port/check_tips.py
      - name: Check the quest book references of the repository namespaces (#18)
        run: python3 tools/port/check_quest_refs.py
      - name: Check mod dependencies of the client and server install (#19)
        # NeoForge refuses to load on a missing, out-of-range or incompatible dependency; the server boot only
        # sees the server mods, so this also covers client-only mods (FancyMenu, WaterMedia, Sodium addons).
        run: |
          python3 tools/port/check_mod_deps.py --side CLIENT
          python3 tools/port/check_mod_deps.py --side SERVER
      - name: Check resource packs and shader pack (#19)
        # Fails on stale pack names, a wrong pack format, Oculus/Embeddium configs or a shader that Colorwheel
        # Patcher cannot patch; the per-pack coverage table in the job summary is only a report.
        run: |
          python3 tools/port/check_resourcepacks.py --download-client 1.21.1 --jars-from-lock \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Export CurseForge pack
        run: |
          JAR=$(ls mod/build/libs/sunlitidle-*.jar | grep -v -- '-sources' | head -n1)
          VERSION="0.2.0-dev.${GITHUB_RUN_NUMBER}"
          python3 tools/export_curseforge.py --mod-jar "$JAR" --version "$VERSION" --out "build/sunlit-valley-idle-${VERSION}.zip"
          # GitHub zips every artifact, so upload the unpacked pack: the downloaded
          # artifact zip then has manifest.json at its root and imports directly.
          mkdir -p build/pack && unzip -q "build/sunlit-valley-idle-${VERSION}.zip" -d build/pack
          echo "PACK_VERSION=${VERSION}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: sunlitidle-mod
          path: mod/build/libs/*.jar
      - uses: actions/upload-artifact@v7
        with:
          name: sunlit-valley-idle-${{ env.PACK_VERSION }}-curseforge
          path: build/pack/

  server-boot:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v7
        with:
          name: sunlitidle-mod
          path: build/mod
      - name: Boot a NeoForge server with the pack and the mod
        run: |
          JAR=$(ls build/mod/sunlitidle-*.jar | grep -v -- '-sources' | head -n1)
          python3 tools/port/server_boot_test.py --dir build/server --extra-mod "$JAR" --kubejs-tests tools/port/kubejs_tests
          # KubeJS must load without errors and the KubeJS tests must pass (the script fails otherwise).
          # The mod must have loaded, and Pufferfish's Skills must have accepted its skill categories.
          grep -q "sunlitidle" build/server/logs/latest.log
          if grep -q "Data pack \`sunlitidle\` could not be loaded" build/server/logs/latest.log; then
            echo "Pufferfish's Skills rejected the sunlitidle skill categories"; exit 1
          fi
      - name: Check placeholder models and textures of society items (#22)
        # Every society:* item and machine must resolve to textures that are in the vanilla client jar or a
        # pack mod; the Society Tweaks assets are ARR and not in the repository.
        run: |
          MC=$(python3 -c "import json; print(json.load(open('pakku-lock.json'))['mc_versions'][0])")
          python3 tools/port/assets/check_placeholders.py --download-client "$MC" --jar-dir build/server/mods
      - name: Check every id and image of the quest book (#18)
        # registryDump.js wrote the server's registries during the boot; images resolve against the jars.
        run: |
          MC=$(python3 -c "import json; print(json.load(open('pakku-lock.json'))['mc_versions'][0])")
          python3 tools/port/check_quest_refs.py --registry build/server/kubejs/registry_dump.json \
            --jar-dir build/server/mods --download-client "$MC"
      - name: Report Pufferfish's Skills config problems
        if: always()
        run: grep -n -i -E "puffish|skills.*(error|invalid)" build/server/logs/latest.log | head -50 || true
      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs
          path: |
            build/server/logs/
            build/server/crash-reports/
          if-no-files-found: ignore
