name: Build mod and pack

# Port branch (epic #5): builds the sunlitidle mod on 1.21.1 NeoForge, runs its unit and game tests,
# exports the pack with it and boots a NeoForge server with the whole pack plus the mod as a smoke test.
# The server job also simulates one in-game year and gates on KubeJS errors; the client job boots the
# client headless into the server. docs/port/playthrough-checklist.md maps the #19 checklist to these checks.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Download Gradle
        # The Gradle distribution host has outages; retry for a few minutes before giving up.
        working-directory: mod
        run: |
          chmod +x gradlew
          for attempt in 1 2 3 4 5 6; do
            ./gradlew --version --no-daemon && exit 0
            echo "Gradle download failed (attempt $attempt), retrying in 60 s"; sleep 60
          done
          exit 1
      - name: Build mod and run unit tests
        working-directory: mod
        run: |
          ./gradlew build --no-daemon
      - name: Run in-game tests
        working-directory: mod
        run: |
          ./gradlew runGameTestServer --no-daemon 2>&1 | tee gametest.log
          # Fail if the tests were not found or did not all pass.
          grep -E "All [0-9]+ required tests passed" gametest.log
      - name: Check loading screen tips (#18)
        run: python3 tools/port/check_tips.py
      - name: Check dialog and shop portraits
        run: python3 tools/port/check_dialog_textures.py
      - name: Check the quest book references of the repository namespaces (#18)
        run: python3 tools/port/check_quest_refs.py
      - name: Check mod dependencies of the client and server install (#19)
        # NeoForge refuses to load on a missing, out-of-range or incompatible dependency; the server boot only
        # sees the server mods, so this also covers client-only mods (FancyMenu, WaterMedia, Sodium addons).
        # The mod ids of the client install go to the config id sweep of the server-boot job (client-only mods).
        run: |
          python3 tools/port/check_mod_deps.py --side CLIENT --mod-ids-out build/mod-ids/mod-ids-client.json
          python3 tools/port/check_mod_deps.py --side SERVER
      - name: Check resource packs and shader pack (#19)
        # Fails on stale pack names, a wrong pack format, Oculus/Embeddium configs or a shader that Colorwheel
        # Patcher cannot patch; the per-pack coverage table in the job summary is only a report.
        run: |
          python3 tools/port/check_resourcepacks.py --download-client 1.21.1 --jars-from-lock \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Check that every script and config is ported (#19)
        # kubejs/_unported held the 1.20.1 scripts and config/_unported the 1.20.1 mod configs that still
        # needed a port; #19 requires both to stay gone.
        run: |
          if [ -e kubejs/_unported ]; then echo "kubejs/_unported exists: port or delete what is left"; exit 1; fi
          if [ -e config/_unported ]; then echo "config/_unported exists: port or delete what is left"; exit 1; fi
      - name: Check for config backups in the overrides
        # A *.bak, *.old or config_old_* file in config/ or defaultconfigs/ is a leftover of a mod that rewrote a
        # config; it ships to every player.
        run: python3 tools/port/config_gate.py --repo
      - name: Check client defaults (#19)
        # configureddefaults/options.txt must parse line by line and enable only resource packs the pack ships.
        run: python3 tools/port/check_client_defaults.py
      - name: Check the FancyMenu and Drippy layouts (#19)
        # Every vanilla widget and deep element the layouts target must exist on 1.21.1; FancyMenu silently
        # ignores the rest, and the widget stays at its vanilla place.
        run: python3 tools/port/check_fancymenu_layouts.py
      - name: Export CurseForge pack
        run: |
          JAR=$(ls mod/build/libs/sunlitidle-*.jar | grep -v -- '-sources' | head -n1)
          VERSION="5.0.0-dev.${GITHUB_RUN_NUMBER}"
          python3 tools/export_curseforge.py --mod-jar "$JAR" --version "$VERSION" --out "build/sunlit-valley-idle-${VERSION}.zip"
          # GitHub zips every artifact, so upload the unpacked pack: the downloaded
          # artifact zip then has manifest.json at its root and imports directly.
          mkdir -p build/pack && unzip -q "build/sunlit-valley-idle-${VERSION}.zip" -d build/pack
          echo "PACK_VERSION=${VERSION}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: sunlitidle-mod
          path: mod/build/libs/*.jar
      - uses: actions/upload-artifact@v7
        with:
          name: mod-ids
          path: build/mod-ids/
      - uses: actions/upload-artifact@v7
        with:
          name: sunlit-valley-idle-${{ env.PACK_VERSION }}-curseforge
          path: build/pack/

  server-boot:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v7
        with:
          name: sunlitidle-mod
          path: build/mod
      - name: Boot a NeoForge server with the pack and the mod, then simulate one in-game year
        run: |
          set -o pipefail
          JAR=$(ls build/mod/sunlitidle-*.jar | grep -v -- '-sources' | head -n1)
          python3 tools/port/server_boot_test.py --dir build/server --extra-mod "$JAR" --kubejs-tests tools/port/kubejs_tests \
            --simulate-year 2>&1 | tee build/server-boot.log
          # KubeJS must load without errors (tools/port/kubejs_error_allowlist.txt lists known ones), the KubeJS tests
          # and the pack checks of the year (dev.sunlitidle.ci) must pass; the script fails otherwise. It also fails
          # on InControl rule errors and on configs that a mod archived or backed up during a boot
          # (tools/port/config_gate.py, allowlist tools/port/config_gate_allowlist.txt).
          # The mod must have loaded, and Pufferfish's Skills must have accepted its skill categories.
          grep -q "sunlitidle" build/server/logs/latest.log
          if grep -q "Data pack \`sunlitidle\` could not be loaded" build/server/logs/latest.log; then
            echo "Pufferfish's Skills rejected the sunlitidle skill categories"; exit 1
          fi
      - name: Check placeholder models and textures of society items (#22)
        # Every society:* item and machine must resolve to textures that are in the vanilla client jar or a
        # pack mod; the Society Tweaks assets are ARR and not in the repository.
        run: |
          MC=$(python3 -c "import json; print(json.load(open('pakku-lock.json'))['mc_versions'][0])")
          python3 tools/port/assets/check_placeholders.py --download-client "$MC" --jar-dir build/server/mods
      - uses: actions/download-artifact@v7
        with:
          name: mod-ids
          path: build/mod-ids
      - name: Check the ids in the mod configs
        # Namespaced ids in config/, defaultconfigs/ and configureddefaults/config/ must belong to a mod of the pack
        # (server registry dump plus the client-only mods); InControl mobs, items and biomes must be registered.
        # Known upstream default lists: tools/port/config_id_allowlist.txt.
        run: |
          python3 tools/port/check_config_ids.py --registry build/server/kubejs/registry_dump.json \
            --mod-ids build/mod-ids/mod-ids-client.json
      - name: Check every id and image of the quest book (#18)
        # registryDump.js wrote the server's registries during the boot; images resolve against the jars.
        run: |
          MC=$(python3 -c "import json; print(json.load(open('pakku-lock.json'))['mc_versions'][0])")
          python3 tools/port/check_quest_refs.py --registry build/server/kubejs/registry_dump.json \
            --jar-dir build/server/mods --download-client "$MC"
      - name: Report Pufferfish's Skills config problems
        if: always()
        run: grep -n -i -E "puffish|skills.*(error|invalid)" build/server/logs/latest.log | head -50 || true
      - name: Summary
        if: always()
        run: |
          {
            echo "## Server boot and simulated year"
            echo '```'
            grep -E "^=== |^  (ERROR|allowed|stale|PASS|FAIL)|^KubeJS test .* failed" build/server-boot.log | head -300 || true
            echo '```'
            echo "### Performance (not gated)"
            echo '```'
            grep -oE "Done \([0-9.]+s\)" build/server-boot.log || true
            grep -oE "Sprint completed with [0-9.]+ ticks per second" build/server-boot.log \
              | awk '{s+=$4; n++} END {if (n) printf "simulated year: %d sprints, average %.0f ticks per second\n", n, s/n}' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs
          path: |
            build/server-boot.log
            build/server/kubejs/registry_dump.json
            build/server/logs/
            build/server/crash-reports/
          if-no-files-found: ignore

  client-boot:
    # Boots the client with the whole pack on a virtual display with software OpenGL (Mesa llvmpipe) and joins a
    # pack server: screenshot, KubeJS client errors, renderer (Iris/Sodium), FancyMenu and resource pack errors.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: sunlitidle-mod
          path: build/mod
      - name: Install Xvfb, Mesa, ImageMagick, xdotool and portablemc
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb imagemagick xdotool libgl1-mesa-dri libglx-mesa0 libegl1 \
            libgl1 libxrandr2 libxxf86vm1 libxcursor1 libxi6 libxtst6
          pip install portablemc==4.4.1
      - name: Boot the client into a pack server
        run: |
          set -o pipefail
          JAR=$(ls build/mod/sunlitidle-*.jar | grep -v -- '-sources' | head -n1)
          python3 tools/port/client_boot_test.py --dir build/client --extra-mod "$JAR" 2>&1 | tee build/client-boot.log
      - name: Summary
        if: always()
        run: |
          {
            echo "## Client boot"
            echo '```'
            grep -E "^=== |^  (ERROR|allowed|stale)|^Server saw|^Screenshot|^Client|failed" build/client-boot.log | head -200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload client screenshot and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-logs
          path: |
            build/client-boot.log
            build/client/*.png
            build/client/client-console.log
            build/client/game/logs/
            build/client/game/crash-reports/
            build/client/server/logs/
            build/client/game/config/
            build/client/server/config/
          if-no-files-found: ignore
